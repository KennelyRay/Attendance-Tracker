<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>Offline — HRIS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(34, 211, 238, 0.12), transparent 24%),
          radial-gradient(circle at top right, rgba(59, 130, 246, 0.14), transparent 28%),
          linear-gradient(180deg, #07111f 0%, #081525 48%, #091829 100%);
        color: #e6f3ff;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 24rem;
        text-align: center;
        padding: 32px 24px;
        border-radius: 1rem;
        border: 1px solid rgba(56, 189, 248, 0.1);
        background: rgba(2, 8, 23, 0.7);
        box-shadow: 0 22px 60px rgba(2, 8, 23, 0.45);
      }
      img { width: 56px; height: 56px; display: block; margin: 0 auto 20px; border-radius: 14px; }
      h1 { margin: 0 0 8px; font-size: 1.15rem; font-weight: 600; color: #f1f5f9; }
      p { margin: 0; font-size: 0.875rem; line-height: 1.6; color: #94a3b8; }
      button {
        margin-top: 24px;
        width: 100%;
        height: 2.75rem;
        border: 0;
        border-radius: 0.75rem;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        color: #020617;
        background: linear-gradient(to right, #0ea5e9, #22d3ee);
        box-shadow: 0 12px 30px rgba(34, 211, 238, 0.28);
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
      button:focus-visible { outline: 2px solid #38bdf8; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You&rsquo;re offline</h1>
      <p>
        HRIS needs a connection to show attendance and leave records. Your data is safe &mdash;
        reconnect and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
