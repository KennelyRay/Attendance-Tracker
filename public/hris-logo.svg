<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HRIS">
  <title>HRIS</title>
  <defs>
    <linearGradient id="badge" x1="52" y1="28" x2="470" y2="496" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12365A"/>
      <stop offset="0.52" stop-color="#0A2036"/>
      <stop offset="1" stop-color="#050F1C"/>
    </linearGradient>
    <radialGradient id="corner-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(110 78) rotate(52) scale(330)">
      <stop stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BAE6FD" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#7DD3FC" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="dial" x1="86" y1="420" x2="420" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="mark" x1="158" y1="142" x2="354" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0FBFF"/>
      <stop offset="0.42" stop-color="#93DDFD"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow" x="98" y="88" width="316" height="336" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="blur" in2="SourceAlpha" operator="out" result="ring"/>
      <feFlood flood-color="#38BDF8" flood-opacity="0.55"/>
      <feComposite in2="ring" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- badge -->
  <rect width="512" height="512" rx="118" fill="url(#badge)"/>
  <rect width="512" height="512" rx="118" fill="url(#corner-glow)"/>
  <rect x="2" y="2" width="508" height="508" rx="116" stroke="url(#rim)" stroke-width="4"/>

  <!-- attendance dial: full period track + elapsed arc with a "now" marker -->
  <g transform="rotate(-90 256 256)">
    <circle cx="256" cy="256" r="178" stroke="#7DD3FC" stroke-opacity="0.11" stroke-width="18"/>
    <circle cx="256" cy="256" r="178" stroke="url(#dial)" stroke-width="18" stroke-linecap="round"
            stroke-dasharray="805 314" opacity="0.85"/>
  </g>
  <circle cx="81" cy="289" r="15" fill="#E0F7FF"/>
  <circle cx="81" cy="289" r="15" fill="#22D3EE" fill-opacity="0.35"/>

  <!-- H monogram: solid stem + segmented timesheet stem -->
  <g fill="url(#mark)" filter="url(#glow)">
    <rect x="158" y="148" width="44" height="216" rx="22"/>
    <rect x="310" y="148" width="44" height="72" rx="22"/>
    <rect x="310" y="292" width="44" height="72" rx="22"/>
    <rect x="158" y="235" width="196" height="42" rx="21"/>
  </g>
</svg>
